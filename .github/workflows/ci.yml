name: producer-ci
on:
  push:
  pull_request:
jobs:
  deterministic-harness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install --upgrade pytest
      - run: python -m pytest -q
  real-trivy-consumer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Download and verify pinned Trivy
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL -o trivy.tar.gz https://github.com/aquasecurity/trivy/releases/download/v0.74.0/trivy_0.74.0_Linux-64bit.tar.gz
          echo '2ae6fe3ee734b7fdf11335663e18c75ea12dccc76062f09f164a3b0f8be4371a  trivy.tar.gz' | sha256sum -c -
          tar -xzf trivy.tar.gz
          test "$(sha256sum trivy | cut -d' ' -f1)" = 'd89bcc6510a267f11b773398cbf1be5520ce39f9e8b6633178c4487f05b7d791'
          test "$(./trivy --version | sed -n 's/^Version: //p')" = '0.74.0'
      - name: Run real producer and consumer
        run: |
          python -m src.producer --trivy ./trivy --artifact artifacts/requirements.txt --out out
          git clone https://github.com/yandexuanxuan/mcp-evidence-gate.git core
          git -C core checkout --detach d404b38f0ac0303438b561fe7358b0eec487c962
          corepack enable
          pnpm --dir core install --frozen-lockfile
          pnpm --dir core build
          set +e
          node core/dist/cli.js verify --receipt out/receipt.json --artifact artifacts/requirements.txt --evidence out/evidence.json --policy permissive --format json > gate.json
          code=$?
          set -e
          node -e "const fs=require('fs'); const g=JSON.parse(fs.readFileSync('gate.json')); const r=JSON.parse(fs.readFileSync('out/receipt.json')); if(g.receiptVerdict!==r.verdict || (r.verdict==='findings' && g.decision!=='fail') || (r.verdict==='clean' && g.decision==='fail')) process.exit(1); if(![0,1,2].includes(Number(process.env.CODE||'$code'))) process.exit(1);"
          node -e "const fs=require('fs'),c=require('crypto'); const a=fs.readFileSync('artifacts/requirements.txt'); const e=fs.readFileSync('out/evidence.json'); const r=JSON.parse(fs.readFileSync('out/receipt.json')); if(r.scanned_artifact_digest!=='sha256:'+c.createHash('sha256').update(a).digest('hex')) process.exit(1); if(r.evidence_digest!=='sha256:'+c.createHash('sha256').update(e).digest('hex')) process.exit(1); if(r.scanner_version!=='0.74.0') process.exit(1);"
